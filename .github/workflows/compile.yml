name: Compile Sketch

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Platform
        run: |
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Install Libraries
        run: |
          arduino-cli lib install "Blynk"
          arduino-cli lib install "UniversalTelegramBot"
          arduino-cli lib install "U8g2"
          arduino-cli lib install "ESP32Servo"
          arduino-cli lib install "DFRobotDFPlayerMini"
          arduino-cli lib install "WiFiManager"

      - name: Create Dummy Secrets File
        run: |
          cp secrets.example.h secrets.h

      - name: Compile Sketch
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32 MessageBox.ino --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
